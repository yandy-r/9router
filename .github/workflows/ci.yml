name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  test:
    name: Tests (vs known-fails baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json
      # Tests import from src/ and open-sse/, so root deps are required too.
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: tests
      - name: Run vitest
        working-directory: tests
        # The suite is not all-green by design; the regression gate below decides.
        # --update=new: CI=true blocks writing missing snapshots; upstream deliberately
        # ships golden-url-header without one (71a0822b). Mismatches still fail.
        run: npx vitest run --update=new --reporter=json --outputFile=results.json || true
      - name: Regression gate
        working-directory: tests
        run: node __baseline__/verify-no-regression.mjs results.json
      - name: Alias baseline
        run: node tests/__baseline__/verify-alias.mjs
      - name: OAuth URL baseline
        run: node tests/__baseline__/verify-oauth-urls.mjs

  build:
    name: Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
