name: Docker Image

# Publishing a GitHub release builds and pushes ghcr.io/<owner>/<repo>:
#   :<version> and :<major>.<minor> from the release tag (e.g. v1.2.3 → 1.2.3, 1.2)
#   :latest    only when the release is the repo's "Latest release"
#   :sha-<sha>
# Manual runs build the chosen ref without pushing unless `push` is checked.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      push:
        description: Push the image to GHCR (tagged by branch and sha only, never :latest)
        type: boolean
        default: false

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'release' || inputs.push }}

    steps:
      - uses: actions/checkout@v4

      # Tag :latest only when this release is what GitHub marks as "Latest release"
      # (not a prerelease/draft, and not an older-version backport published later).
      - name: Resolve latest release
        id: latest
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          latest_tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          echo "GitHub latest release: ${latest_tag}; this release: ${TAG}"
          echo "is_latest=$([ "$latest_tag" = "$TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.latest.outputs.is_latest == 'true' }}
            type=ref,event=branch
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The Dockerfile defaults to CN mirrors; hosted runners use the upstream registries.
          build-args: |
            APK_MIRROR=dl-cdn.alpinelinux.org
            NPM_REGISTRY=https://registry.npmjs.org
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
