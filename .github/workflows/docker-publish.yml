name: Docker Image

# Pushing a v* tag builds and pushes ghcr.io/<owner>/<repo>:
#   :<version> and :<major>.<minor> from the tag (e.g. v1.2.3 → 1.2.3, 1.2)
#   :latest    only when the tag is the highest stable vX.Y.Z tag in the repo
#   :sha-<sha>
# Nothing runs on branch pushes. Manual runs build the chosen ref without pushing
# unless `push` is checked.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push:
        description: Push the image to GHCR (tagged by branch and sha only, never :latest)
        type: boolean
        default: false

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' || inputs.push }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags, to find the highest version below

      # Tag :latest only when this tag is the highest stable vX.Y.Z tag, so
      # prereleases (v1.3.0-rc.1) and older-version backports never move it.
      - name: Resolve latest tag
        id: latest
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          highest=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          echo "highest stable tag: ${highest:-none}; this tag: ${TAG}"
          echo "is_latest=$([ "$highest" = "$TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.latest.outputs.is_latest == 'true' }}
            type=ref,event=branch
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The Dockerfile defaults to CN mirrors; hosted runners use the upstream registries.
          build-args: |
            APK_MIRROR=dl-cdn.alpinelinux.org
            NPM_REGISTRY=https://registry.npmjs.org
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
